<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دخول المستر | الخبير أحمد حاتم</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f7f9fc;color:#172033;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{width:min(430px,100%);background:#fff;border-radius:20px;padding:35px;box-shadow:0 15px 45px rgba(0,0,0,.10)}
.logo{text-align:center;font-size:26px;font-weight:bold;color:#123c69;margin-bottom:8px}.logo span{color:#d89b28}
.sub{text-align:center;color:#6d7787;margin-bottom:28px}
label{display:block;font-weight:bold;margin:15px 0 7px}input{width:100%;padding:13px;border:1px solid #dbe1e8;border-radius:9px;font-size:16px;outline:none}input:focus{border-color:#123c69}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:9px;background:#d89b28;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}button:disabled{opacity:.6}
.msg{margin-top:15px;padding:11px;border-radius:8px;display:none}.error{display:block;background:#fff0f0;color:#a11}.ok{display:block;background:#effaf2;color:#18733b}
.back{display:block;text-align:center;margin-top:20px;color:#123c69;text-decoration:none}
</style>
</head>
<body>
<div class="card">
  <div class="logo">الخبير <span>أحمد حاتم</span></div>
  <div class="sub">تسجيل دخول لوحة تحكم المستر</div>
  <form id="loginForm">
    <label for="email">الإيميل</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="password">كلمة المرور</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button id="loginBtn">دخول</button>
    <div id="msg" class="msg"></div>
  </form>
  <a class="back" href="index.html">العودة للموقع</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
const form=document.getElementById("loginForm"), btn=document.getElementById("loginBtn"), msg=document.getElementById("msg");
function show(t,c){msg.textContent=t;msg.className="msg "+c}
form.addEventListener("submit",async e=>{
  e.preventDefault(); btn.disabled=true; show("جارٍ تسجيل الدخول...","ok");
  const {error}=await supabaseClient.auth.signInWithPassword({
    email:document.getElementById("email").value.trim(),
    password:document.getElementById("password").value
  });
  if(error){show("الإيميل أو كلمة المرور غير صحيحة.","error");btn.disabled=false;return}
  location.href="admin.html";
});
supabaseClient.auth.getSession().then(({data})=>{if(data.session) location.href="admin.html"});
</script>
</body>
</html>
